# Halo CE dedicated server: the host's own settings.
# Cada clave tiene su explicacion en docs/dedicated_server.md del proyecto;
# una clave mal escrita se escribe en el log y se queda en su valor por
# defecto. El archivo se reescribe con los defaults en el primer arranque.

[debug]
# un server no tiene pantalla: nada se dibuja, no se hace ventana
null_renderer = true

# la lista de mapas que hostea, en el orden en que la rota: entradas de
# "mapa" o "mapa:variante,variante", ";" entre ellas, y vuelta a la primera
# despues de la ultima. Los nombres son los de las listas del juego
# ("levels\test\wizard", y un mapa de Custom Edition como
# "custom_maps\<nombre>")
network_test = "host:beavercreek:gun_game,swat,infection,hardcore_slayer,hardcore_oddball;wizard:gun_game,swat,hardcore_king,infection;chillout:infection,swat,gun_game,hardcore_slayer,hardcore_oddball;damnation:swat,gun_game,hardcore_slayer,hardcore_king;prisoner:gun_game,swat,infection,hardcore_slayer;longest:swat,gun_game,hardcore_slayer;putput:infection,gun_game,swat;hangemhigh:swat,infection,gun_game,hardcore_slayer"

# los minutos que dura cada partida de la lista, para que una partida que
# nadie gana termine igual y la lista avance
network_test_time = 15

# los segundos que el lobby cuenta hacia el arranque de la partida.
# 0: el del juego, 31 segundos
network_test_countdown = 15

# cuanto espera el host a un countdown antes de arrancar la partida a la
# fuerza, cuando nada mas la arranca
network_test_start = 1.0

# true (recomendado para 24/7): el host toma un jugador propio inactivo,
# lo que permite que el countdown arranque solo a los 15 segundos y el juego
# pase a 'in_game' para que cualquier jugador se una en caliente.
# false: espera en el lobby; en modos por equipos requiere jugadores en ambos
# bandos antes de iniciar el countdown.
network_test_player = true

# Operator console: listen on 127.0.0.1 for kick/ban/say commands.
# Access with: scripts/operator.sh kick "PlayerName"
telnet_console = false
telnet_console_port = 2323

[audio]
# no se abre dispositivo de audio
enabled = false

[paths]
# la raiz de datos, cuando los mapas no estan al lado del ejecutable
# (en Docker es /halo, con /halo/maps)
# data = "/srv/halo"

[network]
# el nombre que su listado muestra en el Server Browser de todos (32 bytes
# como mucho en el browser; el lobby del juego muestra 15 caracteres)
server_name = "JOCES 24/7 CUSTOM"

# el puerto UDP del juego por internet: uno fijo, para que la regla del
# firewall y el forward del router lo nombren (0 deja que el juego elija uno
# en cada arranque)
tunnel_port = 2302

# Allow text chat in publicly listed games (dedicated server with moderation only).
# Requires network.text_chat = "on" or "links". Default: false.
public_chat = false

# Join password. Empty = open server (default).
# When set, the game listing shows as locked in the browser and players must
# provide the password to join.
server_password = ""

# TCP port for the HTTP health check endpoint (GET /health).
# 0 turns it off (default). Bind to 0.0.0.0 so containers can publish it.
health_port = 0

# Map rotation mode: "sequence" (default) or "shuffle".
# "sequence" advances through the playlist entries in order, looping back.
# "shuffle" chooses a pseudo-random map and variant across the playlist,
# avoiding selecting the exact same map/variant twice in a row (if length > 1).
map_rotation = "sequence"

# Allow players to vote for the next map and gametype in the lobby by typing
# the option number in chat. Default: false.
map_voting = false

# Number of map and gametype choices presented in lobby vote (2 to 5). Default: 3.
map_vote_options = 3

# Seconds of inactivity before an idle player is kicked from an active game.
# At 30 seconds before the limit, a private warning notice is sent.
# 0 disables the AFK kick. Default: 180 (3 minutes).
afk_timeout = 180

# Escalating progressive bans for operator bans:
# Strike 1: 1 hour | Strike 2: 24 hours | Strike 3: 7 days | Strike 4+: permanent
# Expirations are recorded in bans.txt and cleaned automatically.
# Set to false to issue permanent bans immediately on every strike. Default: true.
escalating_bans = true


[display]
# avisa a los jugadores, en la zona de chat, cuanto queda de partida y el
# countdown del lobby
time_notices = true
