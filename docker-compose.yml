services:
  halo-server:
    # the prebuilt image (pulled, ~139 MB); remove it to build from source
    # (an Arch toolchain, about 15 minutes the first time)
    image: ghcr.io/joshrob297/halo-ce-server:latest
    build: .
    container_name: halo-server
    restart: unless-stopped
    # Operator: docker exec halo-server /halo/scripts/operator.sh status
    # Enable console: set HALO_TELNET_CONSOLE=true in environment:
    # environment:
    #   - HALO_TELNET_CONSOLE=true
    ports:
      # the game's UDP port (network.tunnel_port); change it on both sides
      - "2302:2302/udp"
    volumes:
      # your maps (from your own disc); not in the image
      - ./maps:/halo/maps:ro
      # Halo PC / Custom Edition maps (optional)
      - ./custom_maps:/halo/custom_maps:ro
      # saved games and the cache (kept across restarts)
      - ./saved:/root/.local/share/halo-linux
      # override the sample config with your own (optional)
      # - ./config.toml:/halo/config.toml:ro
