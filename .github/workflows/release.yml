name: Release

# Compila y publica automaticamente los binarios para todas las arquitecturas
# soportadas (Linux x86_64, Linux ARM64 para Raspberry Pi y Linux i686)
# cuando se crea un tag de release (v*).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build Multi-Arch Release Packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm qemu-user-static libwayland-bin \
            zip unzip tar gzip coreutils
          # llvm-rc escribe los recursos del .exe; Ubuntu lo instala con sufijo
          if ! command -v llvm-rc >/dev/null 2>&1; then
            sudo ln -sf "$(ls /usr/bin/llvm-rc-* 2>/dev/null | tail -1)" /usr/local/bin/llvm-rc
          fi

      - name: Clone OpenCE Dedicated Server Engine (netcode v41)
        run: |
          git clone --depth 1 --branch feat/rebase-upstream-build309 https://github.com/JoshRob297/halo-ce-touch.git /tmp/halo-engine

      - name: Package Linux x86 (i686) Portable
        run: |
          mkdir -p release-dist/x86/halo-server-linux-x86
          mkdir -p release-dist/x86/halo-server-linux-x86/scripts
          mkdir -p release-dist/x86/halo-server-linux-x86/maps
          mkdir -p release-dist/x86/halo-server-linux-x86/custom_maps
          
          # Compilar el motor desde el fork (netcode v41) en lugar de reutilizar
          # un portable antiguo: el release publica exactamente lo que compila.
          # --portable enlaza contra el sysroot Debian 11 i386 y trae su propio
          # libSDL3.so.0 al lado del ejecutable.
          cd /tmp/halo-engine
          # The engine reports its build number; the release names it.
          export HALO_BUILD_NUMBER="${{ github.run_number }}"
          python3 configure.py --portable --release
          ninja linux
          file build/linux/halo
          build/linux/halo --version
          cd "$GITHUB_WORKSPACE"

          cp /tmp/halo-engine/build/linux/halo release-dist/x86/halo-server-linux-x86/
          cp /tmp/halo-engine/build/linux/libSDL3.so.0 release-dist/x86/halo-server-linux-x86/
          cp /tmp/halo-engine/build/linux/SDL3-LICENSE.txt release-dist/x86/halo-server-linux-x86/
          cp /tmp/halo-engine/build/linux/brokers.txt release-dist/x86/halo-server-linux-x86/ 2>/dev/null || true
          cp /tmp/halo-engine/build/linux/masters.txt release-dist/x86/halo-server-linux-x86/ 2>/dev/null || true

          if [ ! -x release-dist/x86/halo-server-linux-x86/halo ]; then
            echo "ERROR: el build no produjo el binario halo; se aborta el release." >&2
            exit 1
          fi

          cp server/config.toml release-dist/x86/halo-server-linux-x86/
          cp scripts/* release-dist/x86/halo-server-linux-x86/scripts/
          chmod +x release-dist/x86/halo-server-linux-x86/scripts/*
          
          cd release-dist/x86
          tar -czf ../../halo-server-linux-x86.tar.gz halo-server-linux-x86
          cd ../..

      - name: Package Linux x86_64 Native
        run: |
          mkdir -p release-dist/x64/halo-server-linux-x64
          mkdir -p release-dist/x64/halo-server-linux-x64/scripts
          mkdir -p release-dist/x64/halo-server-linux-x64/maps
          mkdir -p release-dist/x64/halo-server-linux-x64/custom_maps
          
          # Bundle x86_64: motor i386 con multilib. No es un binario nativo.
          cp -r release-dist/x86/halo-server-linux-x86/* release-dist/x64/halo-server-linux-x64/
          if [ ! -x release-dist/x64/halo-server-linux-x64/halo ]; then
            echo "ERROR: bundle x64 sin binario halo." >&2
            exit 1
          fi
          
          cd release-dist/x64
          tar -czf ../../halo-server-linux-x64.tar.gz halo-server-linux-x64
          cd ../..

      - name: Package Linux ARM64 (Raspberry Pi 3B/4/5 & Oracle Cloud)
        run: |
          mkdir -p release-dist/arm64/halo-server-linux-arm64
          mkdir -p release-dist/arm64/halo-server-linux-arm64/scripts
          mkdir -p release-dist/arm64/halo-server-linux-arm64/maps
          mkdir -p release-dist/arm64/halo-server-linux-arm64/custom_maps
          
          # El motor es i386 de 32 bits: en aarch64 corre bajo qemu-i386-static,
          # que install-server.sh instala y usa en el ExecStart del servicio.
          # Una build nativa aarch64 sigue pendiente; las notas lo dicen.
          cp -r release-dist/x86/halo-server-linux-x86/* release-dist/arm64/halo-server-linux-arm64/
          printf '%s\n' \
            'This ARM64 package carries the i386 engine.' \
            'install-server.sh installs qemu-i386-static with the i386 libraries and' \
            'runs the engine through it, so the server starts on aarch64 as it does' \
            'on x86_64. Expect the emulation overhead; a native aarch64 build is pending.' \
            > release-dist/arm64/halo-server-linux-arm64/ARCH_NOTES.txt
          
          cd release-dist/arm64
          tar -czf ../../halo-server-linux-arm64.tar.gz halo-server-linux-arm64
          cd ../..

      - name: Package Windows x86/x64 Standalone
        run: |
          # El motor Windows se compila aqui: el zip de la v1.2.0 solo aporta los
          # .bat y los textos de servicio, que se reemplazan por el binario nuevo.
          mkdir -p release-dist/windows/halo-server-windows/scripts
          curl -fsSL https://github.com/JoshRob297/halo-ce-server/releases/download/v1.2.0/halo-server-windows.zip -o /tmp/win-base.zip
          unzip -q -o /tmp/win-base.zip -d release-dist/windows/

          # Toolchain MSVC + Windows SDK (32 bits) sin Visual Studio
          curl -fsSL -o /tmp/xwin.tar.gz \
            https://github.com/Jake-Shadle/xwin/releases/download/0.10.0/xwin-0.10.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/xwin.tar.gz -C /tmp
          /tmp/xwin-0.10.0-x86_64-unknown-linux-musl/xwin --arch x86 --accept-license \
            splat --use-winsysroot-style --output /tmp/winsdk

          VCTOOLS="$(ls -d /tmp/winsdk/VC/Tools/MSVC/* | tail -1)"
          cd /tmp/halo-engine
          rm -rf build/windows/case_bridge build.ninja
          python3 configure.py --windows-cross --portable \
            --windows-vctools-dir "$VCTOOLS" \
            --windows-sdk-dir "/tmp/winsdk/Windows Kits/10"
          export HALO_BUILD_NUMBER="${{ github.run_number }}"
          ninja windows
          file build/windows/halo.exe
          cd "$GITHUB_WORKSPACE"

          if [ ! -f /tmp/halo-engine/build/windows/halo.exe ]; then
            echo "ERROR: el build de Windows no produjo halo.exe; se aborta el release." >&2
            exit 1
          fi
          cp /tmp/halo-engine/build/windows/halo.exe release-dist/windows/halo-server-windows/
          cp /tmp/halo-engine/build/windows/SDL3.dll release-dist/windows/halo-server-windows/
          cp server/config.toml release-dist/windows/halo-server-windows/
          cp scripts/* release-dist/windows/halo-server-windows/scripts/

          cd release-dist/windows
          zip -r ../../halo-server-windows.zip halo-server-windows
          cd ../..

      - name: Generate Checksums
        run: |
          sha256sum halo-server-linux-*.tar.gz halo-server-windows.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            halo-server-linux-x86.tar.gz
            halo-server-linux-x64.tar.gz
            halo-server-linux-arm64.tar.gz
            halo-server-windows.zip
            SHA256SUMS
